# Termux properties - optimized for razr 50 + Clicks physical keyboard
# Ref: https://wiki.termux.com/wiki/Termux:Configuration

# --- Extra keys ---
# 物理キーボードありでも、スマホだけの時や Ctrl/Alt が押しにくい場面用に1段だけ残す
# Clicks側で Alt/Ctrl が効く場合はこの行は補助的に使える
extra-keys = [['ESC','|','-','HOME','UP','END','PGUP'],['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN']]

# --- Appearance ---
# razr 50 の縦長画面でフォントは少し大きめが見やすい。任意で調整
# font-size=16

# --- Behaviour ---
# 物理キーボードの Alt が Meta として使えるように
enforce-char-based-input = true
# ベル音不要
bell-character = ignore
# 長押しで選択メニューではなく直接ペースト/選択しやすく
# use-black-ui = true

# --- Volume keys as extra (optional, Clicks環境では無効化推奨) ---
# volume-keys = volume
