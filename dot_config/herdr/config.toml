onboarding = false

[server]
headless_cols = 160
headless_rows = 60

[terminal]
default_shell = "fish"
shell_mode = "login"

[theme]
name = "catppuccin-mocha"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "terminal_title_stripped"],
]
row_gap = 0

[ui.toast]
delivery = "system"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
pane_history = false