<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Prefer the Japanese regional variants of Noto CJK.

    fontconfig's default prefer list (65-nonlatin.conf) names only
    "Noto Sans CJK KR" and no JP entry, and every Noto CJK regional face
    declares ja/ko/zh-cn/zh-tw. Since family-list order outranks the lang
    match, all CJK text ended up with Korean glyph variants.

    Keep the Latin font first so Latin text is unchanged; the JP face is
    placed before the KR entries that 65-nonlatin.conf adds later.
  -->
  <match target="pattern">
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK JP</string></edit>
  </match>
  <!-- Apps that ask for the Latin family by name (GTK, waybar, ...) -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Sans</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
</fontconfig>
